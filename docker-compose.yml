services:
  sldl:
    build:
      context: .
      dockerfile: Dockerfile
    image: slsk-batchdl
    container_name: sldl
    user: "1000:1000"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config:/config
      - ${REAPER_MEDIA_ROOT:-/mnt/4TBExt/Media}:/data
    ports:
      - "54880-54881:54880-54881/tcp"
      - "54880-54881:54880-54881/udp"
    restart: "no"