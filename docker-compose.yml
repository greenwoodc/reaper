services:
  sldl:
    image: slsk-batchdl          # built locally from the cloned repo
    container_name: sldl
    # Match these to the user who owns /mnt/4TBExt/Media/Music
    # Run: id -u && id -g  to get your values
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      # Config dir: holds sldl.conf, missing_tracks.csv, not_found.txt
      - ./config:/config
      # Data dir: maps directly into your existing music library
      - /mnt/4TBExt/Media:/data
    # Expose Soulseek listening port for incoming peer connections (downloads)
    ports:
      - "49998:49998/tcp"
      - "49998:49998/udp"
    # Exit immediately after download completes to avoid persistent login
    restart: "no"
