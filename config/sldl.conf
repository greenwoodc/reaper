path = /data/incoming
format = mp3,flac,ogg
pref-format = flac
pref-min-bitrate = 256
name-format = {artist}/{album}/{artist} - {title}
concurrent-jobs = 3
skip-existing = true
search-timeout = 6000
listen-port = 49998
max-stale-time = 15000
fast-search = true
fast-search-min-up-speed = 100
min-shares-aggregate = 3
max-samplerate = 44100

# Instantly filters out users who password-lock or rule-gate their shares
remove-locked = true

# Skips peers whose download queues are completely filled up
remove-full-queue = true

# Dropping timeout from 15s to 8s so the client abandons dead handshakes faster
timeout = 8000

# Cap maximum retry cycles per track to stop it from looping on broken peers
max-retries = 2